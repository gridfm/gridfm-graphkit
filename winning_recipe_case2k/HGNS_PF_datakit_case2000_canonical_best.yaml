# Canonical best PF config for case2000_goc @ 20k (branch `paper`).
# Best observed: ~0.91 MW test active residual (seed0).
# Requires: 2 GPUs, --compile reduce-overhead, paper branch (ckpt=layer_11, LR=val loss).
# Note: 20% physics is seed-fragile —> need to find a fix e.g. different weight init or warm up with reconstruction loss only.
# For case10k use 10% phys (more stable and less divergence) + global bs4 instead.
callbacks:
  patience: 100
  tol: 0
task:
  task_name: PowerFlow
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  normalizer_preset: # you can use that to set the normalizer stats yourself without having to fit everytime. (useful for big datasets)
    baseMVA: 121.0
    vn_kv_max: 345.0
  networks:
  - case2000_goc
  scenarios:
  - 20000
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 16 # per GPU (2 ranks → 32 global)
  split_by_load_scenario_idx: true
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 12 # tiny; small h24 ≈ same at 20% phys;
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  beta1: 0.9
  beta2: 0.999
  learning_rate: 0.0005
  lr_decay: 0.85 # softer than 0.7
  lr_patience: 10 # vs 5
seed: 0 
training:
  batch_size: 8 # 2 GPUs → global batch 16 (bs16 ≫ bs4 on case2k)
  epochs: 300
  loss_weights:
  - 0.2 # 20% physics — wins over 10%; less stable across seeds
  - 0.8
  losses:
  - LayeredWeightedPhysics
  - MaskedBusMSE
  loss_args:
  - base_weight: 0.5
  - {}
  accelerator: auto
  devices: auto
  strategy: auto
verbose: true
