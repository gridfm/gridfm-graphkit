version: 1
# Small CPU-friendly power flow config used by
# examples/notebooks/Tutorial_reconstruction_visualization.ipynb.
# Deliberately tiny (4 layers, hidden 32, 100 epochs) so the tutorial trains in well
# under a minute on a laptop CPU; it is a demo, not a reference training recipe.
# Training longer buys very little here: 250 epochs only moves masked-bus voltage
# magnitude MAE from 0.0071 to 0.0062 p.u. for 2.5x the time.
callbacks:
  patience: 100
  tol: 0
  early_stopping_monitor: Validation loss
  checkpoint_monitor: Validation loss
  lr_scheduler_monitor: Validation loss
task:
  task_name: PowerFlow
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case14_ieee
  scenarios:
  - 72
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 0
  split_by_load_scenario_idx: true
model:
  attention_head: 2
  edge_dim: 10
  hidden_size: 32
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 4
  type: GNS_heterogeneous
optimizer:
  type: AdamW
  learning_rate: 0.0005
  optimizer_params:
    betas: [0.9, 0.999]
  scheduler_type: ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7
    patience: 5
seed: 0
training:
  batch_size: 4
  epochs: 100
  losses:
  - LayeredWeightedPhysics
  - MaskedBusMSE
  loss_weights:
  - 0.1
  - 0.9
  loss_args:
  - base_weight: 0.5
  - {}
  accelerator: cpu
  devices: 1
  strategy: auto
verbose: true
