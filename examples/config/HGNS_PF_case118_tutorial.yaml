version: 1
# MPS/laptop-friendly power flow config used by
# examples/notebooks/Tutorial_contingency_screening_case118.ipynb.
# Trains on a 5,000-scenario slice of the gridfm/pf_small_case118_ieee N-1 dataset
# (the notebook builds the slice); 15 epochs at batch 64 takes 450-665 s on Apple M-series MPS
# (30-44 s/epoch -- the same laptop gave both, so this tracks machine load and thermal state,
# not the config), for 9-11.5 min end-to-end including data prep and analysis.
# This is a demo budget, not a reference training recipe. Measured test accuracy:
# masked-bus Vm RMSE 0.0028-0.0035 p.u. (essentially solved) but Va RMSE 0.123-0.13 rad (~7 deg).
# The ranges are run-to-run spread over two runs: MPS kernels are not bit-deterministic, so
# seed 0 pins the split and initialisation but not the arithmetic. Two runs is enough to show
# the figures move but not to bound them -- the notebook's screening metrics move more than
# these do (scenario overload recall 0.67 vs 0.82, top-20 contingency recovery 6 vs 10 of 20),
# because they are thresholded counts over a few hundred rare events.
# Validation loss is still falling at epoch 15 (0.036 -> 0.014, no plateau), so the model
# is deliberately undertrained; raising the LR to 1.5e-3 to converge faster makes both
# quantities worse (Vm 0.0043, Va 0.130) and the curve noisy, so 5e-4 is kept.
# The residual angle error is what limits line-loading accuracy in the notebook -- see
# its diagnostic cell, which shows predicted Vm with true Va gives loading MAE 0.002-0.003
# while true Vm with predicted Va gives 0.046-0.047.
callbacks:
  patience: 100
  tol: 0
  early_stopping_monitor: Validation loss
  checkpoint_monitor: Validation loss
  lr_scheduler_monitor: Validation loss
task:
  task_name: PowerFlow
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - nb_pf_case118
  scenarios:
  - 5000
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 0
  split_by_load_scenario_idx: true
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 48
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  type: AdamW
  learning_rate: 0.0005
  optimizer_params:
    betas:
    - 0.9
    - 0.999
  scheduler_type: ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7
    patience: 5
seed: 0
training:
  batch_size: 64
  epochs: 15
  losses:
  - LayeredWeightedPhysics
  - MaskedBusMSE
  loss_weights:
  - 0.1
  - 0.9
  loss_args:
  - base_weight: 0.5
  - {}
  accelerator: auto
  devices: 1
  strategy: auto
verbose: true
