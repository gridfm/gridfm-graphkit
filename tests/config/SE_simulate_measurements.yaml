callbacks:
  patience: 100
  tol: 0
  early_stopping_monitor: Validation loss
  checkpoint_monitor: Validation loss
  lr_scheduler_monitor: Validation loss
task:
  task_name: StateEstimation
  noise_type: Gaussian
  measurements:
    power_inj:
      mask_ratio: 0.2
      outlier_ratio: 0.1
      std: 0.02
    power_flow:
      mask_ratio: 0.2
      outlier_ratio: 0.1
      std: 0.02
    vm:
      mask_ratio: 0.2
      outlier_ratio: 0.1
      std: 0.02
  relative_measurement: true
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case14_ieee
  scenarios:
  - 100
  split_by_load_scenario_idx: true
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 1
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 48
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  type: AdamW
  learning_rate: 0.0005
  optimizer_params:
    betas: [0.9, 0.999]
  scheduler_type:  ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7      # previously lr_decay
    patience: 5      # previously lr_patience
seed: 0
training:
  batch_size: 32
  epochs: 1
  losses:
  - LossPerDim
  - LossPerDim
  - LossPerDim
  - LossPerDim
  loss_weights:
  - 0.35
  - 0.35
  - 0.1
  - 0.1
  loss_args:
  - dim: VM
    loss_str: MAE
  - dim: VA
    loss_str: MAE
  - dim: P_in
    loss_str: MAE
  - dim: Q_in
    loss_str: MAE
  accelerator: auto
  devices: auto
  strategy: auto
verbose: true
