version: 1
callbacks:
  patience: 100
  tol: 0
  early_stopping_monitor: Validation loss
  checkpoint_monitor: Validation loss
  lr_scheduler_monitor: Validation loss
task:
  task_name: OptimalPowerFlow
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case14_ieee
  scenarios:
  - 72
  test_ratio: 0.1
  val_ratio: 0.1
  workers: 1
  split_by_load_scenario_idx: true
  stream_partitions: auto
  # The default OptimalPowerFlow pipeline, plus the HH-MPNN positional encoding.
  transforms:
  - RemoveInactiveBranches
  - RemoveInactiveGenerators
  - AddOPFHeteroMask
  - ApplyMasking
  - EffectiveResistancePE
model:
  type: HH_MPNN
  hidden_size: 16
  num_layers: 2
  attention_head: 1
  input_bus_dim: 15
  input_gen_dim: 6
  edge_dim: 10
  load_shunt_nodes: true
  physics_decoder: false
optimizer:
  type: AdamW
  learning_rate: 0.0005
  optimizer_params:
    betas: [0.9, 0.999]
  scheduler_type:  ReduceLROnPlateau
  scheduler_params:
    mode: min
    factor: 0.7
    patience: 5
seed: 0
training:
  batch_size: 4
  epochs: 1
  loss_weights:
  - 0.5
  - 0.5
  losses:
  - MaskedBusMSE
  - MaskedGenMSE
  loss_args:
  - {}
  - {}
  accelerator: auto
  devices: auto
  strategy: auto
verbose: true
