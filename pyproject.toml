[build-system]
requires = ["setuptools >= 83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridfm_graphkit*"]
namespaces = false

[project]
name = "gridfm-graphkit"
description = "Grid Foundation Model"
version = "0.9.0.3"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"

authors = [
  {name = "Matteo Mazzonelli", email = "matteo.mazzonelli1@ibm.com"},
  {name = "Alban Puech", email = "apuech@seas.harvard.edu"},
  {name = "Tamara Govindasamy", email= "tamara.govindasamy@ibm.com"},
  {name = "Mangaliso Mngomezulu", email= "mngomezulum@ibm.com"},
  {name = "Etienne Vos", email= "etienne.vos@ibm.com"},
  {name = "Celia Cintas", email= "celia.cintas@ibm.com"},
  {name = "Jonas Weiss", email= "jwe@zurich.ibm.com"},
]

maintainers = [
  {name = "Matteo Mazzonelli", email = "matteo.mazzonelli1@ibm.com"},
]

keywords = ["electric power grid", "foundational model", "graph neural networks"]

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]


dependencies = [
    "mlflow>=3.1.0",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "opt-einsum>=3.3.0",
    "pandas>=2.3.0",
    "pyyaml>=6.0.2",
    # Stay below 2.13 so the default install matches prebuilt torch-scatter
    # wheels (torch 2.12). vllm 0.29 requires torch==2.13.0; an extra cannot
    # loosen this pin, so the vllm extra cannot be installed alongside it.
    "torch>=2.10,<2.13",
    "torch-geometric>=2.6.1",
    "torch-scatter>=2.1.2",
    "lightning",
    "seaborn",
    "urllib3>=2.6.0",
    "gridfm-datakit==1.1.0",
]

[project.optional-dependencies]
dev = [
  "mkdocs-material",
  "mkdocstrings[python]",
  "pre-commit",
  "bandit",
  "build"
]

test = [
  "gdown>=6.0.0",
  "pytest",
  "pytest-cov",
  "pytest-xdist"
]

# Optional pieces for serving a trained GridFM model through vLLM's /pooling
# endpoint. vllm==0.29.0 (the line this plugin targets; see
# gridfm_graphkit.vllm.utils.SUPPORTED_VLLM) requires torch==2.13.0. That
# conflicts with the base torch<2.13 pin, and an extra cannot loosen a base
# pin. uv's conflict forks still apply project.dependencies, so they cannot
# split the two either. vllm itself is omitted here until torch-scatter ships
# a 2.13 wheel and this cap can be raised. safetensors and timm do not force
# torch 2.13: vLLM parses the served config.json through HuggingFace
# AutoConfig, and a config with no model_type is routed to TimmWrapperConfig,
# whose from_dict requires timm.
vllm = [
  "safetensors>=0.4.0",
  "timm>=1.0.0",
]

[tool.uv]
# torch-scatter is not on PyPI as a universal wheel — prebuilt wheels live on a
# PyG wheel index matching your torch version. The find-links below must be
# updated whenever the torch version in [project.dependencies] changes.
# pip does not read this table. Pass the same index with --find-links; see the
# README. The project pin torch<2.13 selects the 2.12 line, which is the newest
# release with those wheels.
# CPU:  https://data.pyg.org/whl/torch-X.Y.Z+cpu.html
# CUDA: https://data.pyg.org/whl/torch-X.Y.Z+cuNNN.html
# After updating, regenerate the lock file with: uv lock
# Linux and Windows wheels on that index are tagged 2.1.2+pt212cpu; macOS
# wheels are plain 2.1.2. Without these constraints uv locks only the macOS
# version, and `uv sync` on Linux then has no compatible wheel. The markers
# keep each platform on the wheel that index actually publishes. pip does not
# read this table, so a CUDA install can still select +pt212cuNNN from its own
# --find-links URL.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
constraint-dependencies = [
    "torch-scatter==2.1.2+pt212cpu ; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch-scatter==2.1.2 ; sys_platform == 'darwin'",
]
find-links = [
    "https://data.pyg.org/whl/torch-2.12.0+cpu.html",
    "https://data.pyg.org/whl/torch-2.12.0+cu126.html",
]

# torch-scatter's sdist imports torch at build time without declaring it as a
# build dependency. Inject torch into its build environment for platforms that
# still build from the sdist. (uv only reads this from the top-level project,
# so downstream consumers still need their own copy; the real fix belongs in
# torch-scatter's build-system.requires.)
[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]

[tool.pytest.ini_options]
# Register the `integration` marker so the GPU training tests under
# integrationtests/ are selectable and so `--strict-markers` does not warn.
# These tests are heavy (full training runs) and are NOT part of the default
# unit-test CI job, which targets `tests/` only. Select them explicitly, e.g.:
#   pytest integrationtests            # both tests, serial
#   pytest -m integration integrationtests
#   pytest -n 2 integrationtests       # PF and OPF concurrently (needs GPU room)
markers = [
    "integration: end-to-end GPU training tests (slow; run on demand, not in unit CI)",
]

[project.scripts]
gridfm_graphkit = "gridfm_graphkit.__main__:main"

# vLLM plugin entry points. These are inert unless vLLM is installed; vLLM
# discovers them at startup. See gridfm_graphkit/vllm/plugins/.
[project.entry-points."vllm.general_plugins"]
gridfm_gns = "gridfm_graphkit.vllm.plugins.general:register_gridfm"

[project.entry-points."vllm.io_processor_plugins"]
gridfm_pf_reconstruction = "gridfm_graphkit.vllm.plugins.pf_reconstruction:register_pf_reconstruction"
