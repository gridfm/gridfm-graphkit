callbacks:
  patience: 100
  tol: 0
task:
  task_name: PowerFlow
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - hq1200
  scenarios:
  - 250000 # -> just use all of the data your put aside
  test_ratio: 0.99
  val_ratio: 0
  workers: 16 # 1 gpu
  split_by_load_scenario_idx: false
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 12
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  beta1: 0.9
  beta2: 0.999
  learning_rate: 0.0005
  lr_decay: 0.85
  lr_patience: 10
seed: 0
training:
  batch_size: 64 # large for eval
  epochs: 200
  loss_weights:
  - 0.1 # also try 0.2/0.8 ... that will give better results but it is less stable (you might have to use a few different seeds to change the weight initialization)
  - 0.9
  losses:
  - LayeredWeightedPhysics
  - MaskedBusMSE
  loss_args:
  - base_weight: 0.5
  - {}
  accelerator: auto
  devices: auto
  strategy: auto
verbose: true
