callbacks:
  patience: 100
  tol: 0
task:
  task_name: PowerFlow
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - hq1200
  scenarios:
  - 1000
  test_ratio: 0.01
  val_ratio: 0.1
  workers: 16 # 2 gpus. Global number of workers of 32.
  split_by_load_scenario_idx: false
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 12
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  beta1: 0.9
  beta2: 0.999
  learning_rate: 0.0005
  lr_decay: 0.85
  lr_patience: 10
seed: 0
training:
  batch_size: 8 # 2 gpus. Global batch size of 16.
  epochs: 1000
  loss_weights:
  - 0.1 # also try 0.2/0.8 ... better residuals but less stable (try several seeds)
  - 0.9
  losses:
  - LayeredWeightedPhysics
  - MaskedBusMSE
  loss_args:
  - base_weight: 0.5
  - {}
  accelerator: auto
  devices: auto
  strategy: auto
verbose: true
